[pytest]
env =
    SUPABASE_URL=http://localhost:8000
    SUPABASE_SERVICE_ROLE_KEY=dummy
    TELEGRAM_BOT_TOKEN=dummy
    TELEGRAM_CHAT_ID=1234
    GEMINI_API_KEY=dummy
    PULSE_SECRET=dummy
    API_SECRET_KEY=dummy
    ALLOW_DEV_AUTH=1
testpaths = tests
norecursedirs = scripts infra .git .venv venv __pycache__ node_modules .next
addopts = --strict-markers
markers =
    pulse: Pulse engine, run gating, schedule, heartbeat
    briefing: Briefing generation, sections, golden output
    sentinel: Nudges, sweeps, zombie recovery, vps capture
    decision: Approve/reject/undo, auto-decisions, ledger
    learning: Decision → persist → subsequent behavior change (vision #4 loop-end)
    ingest: Telegram/WhatsApp/Teams/Email/Call/Beeper channels, classifier, DLQ
    webhook: Webhook auth, callback routing, test-chat bypass
    auth: OTP, API keys, tenant provisioning, RLS, settings fallback
    calendar: Google/Outlook sync, events, conflicts
    email: Gmail/Outlook ingest, classify, send
    sync: Push notifications, calendar/task two-way sync orchestration
    retrieval: Indexing queue, hybrid search, tsvector, eval
    graph: Nodes/edges, backfill, merges, lineage, memory clusters
    llm_live: Tests that call the real LLM — opt-in only (cost guard, plan §8.2)
    google_live: Tests that hit the real Google API — opt-in only
