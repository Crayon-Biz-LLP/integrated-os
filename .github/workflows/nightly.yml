name: Nightly — Deep Test Suite

on:
  schedule:
    # 01:00 UTC daily = 06:30 IST. Runs the deep tier (L2-live + L3 +
    # coverage + leak guard) against the TEST tenant only — never a push gate.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Deep tier via the unified runner. The env-contract guard (plan §16)
      # refuses to start unless the Test tenant resolves and secrets are
      # real — the shared project IS production, so this never runs blind.
      # TEST_TENANT_UID is resolved by name ('Test' user) when unset.
      - name: Nightly deep suite — live, TEST tenant only
        id: nightly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PULSE_SECRET: ${{ secrets.PULSE_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Webhook test-chat bypass — default-off fail-closed (plans/75 §7).
          # Present ONLY here; prod never sets it, so the gate stays closed.
          TEST_CHAT_IDS: "909999999"
        run: python scripts/run_tests.py nightly --live --coverage 2>&1 | tail -60

  notify_failure:
    runs-on: ubuntu-latest
    needs: nightly
    if: failure()
    steps:
      - name: Notify on failure
        run: |
          echo "⚠️ Nightly deep suite FAILED at $(date)"
          echo "Check logs: https://github.com/${{ github.repository }}/actions"
          echo "Fast-tier pushes are unaffected — this is the deep verification."
