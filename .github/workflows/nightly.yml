name: Nightly — Deep Test Suite

on:
  schedule:
    # 01:00 UTC daily = 06:30 IST. Runs the deep tier (L2-live + L3 +
    # coverage + leak guard) against the TEST tenant only — never a push gate.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # test_migrations_replay.py replays the whole db/ chain on a throwaway
      # local cluster; the chain does CREATE EXTENSION vector (pgvector), so
      # the runner needs the extension installed (fast tier skips it cleanly
      # via the extension-aware guard — this is the nightly home of the test).
      - name: Install pgvector (migration replay)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgvector

      # Deep tier via the unified runner. The env-contract guard (plan §16)
      # refuses to start unless the Test tenant resolves and secrets are
      # real — the shared project IS production, so this never runs blind.
      # TEST_TENANT_UID is resolved by name ('Test' user) when unset.
      - name: Nightly deep suite — live, TEST tenant only
        id: nightly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PULSE_SECRET: ${{ secrets.PULSE_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Webhook test-chat bypass — default-off fail-closed (plans/75 §7).
          # Present ONLY here; prod never sets it, so the gate stays closed.
          TEST_CHAT_IDS: "909999999"
          # api coverage floor: calibrated to the measured baseline
          # (2026-08-16: api/index.py 12%, api/briefing.py 10%, TOTAL api
          # 12%) — same measured-baseline pattern core uses (23%→20). The
          # default 20 was never validated against api; lifting api back to
          # the default is tracked follow-up (plans/75 §16 D6).
          API_COV_FLOOR: "10"
        # Exit code must reach GitHub: the old `| tail -60` pipe (no
        # pipefail) always exited 0 — the nightly was silently RED while
        # the job reported success. No pipe at all: full output streams to
        # the run log (pytest -q keeps it compact), and a failure fails the
        # step. pipefail stays as a guard if a pipe is ever re-added.
        run: |
          set -o pipefail
          python scripts/run_tests.py nightly --live --coverage

  notify_failure:
    runs-on: ubuntu-latest
    needs: nightly
    if: failure()
    steps:
      - name: Notify on failure
        run: |
          echo "⚠️ Nightly deep suite FAILED at $(date)"
          echo "Check logs: https://github.com/${{ github.repository }}/actions"
          echo "Fast-tier pushes are unaffected — this is the deep verification."
