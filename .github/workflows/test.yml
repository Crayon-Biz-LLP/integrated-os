name: CI — Fast Tier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Fast tier = L0 (ruff + residue) + L1 + L2-mock. Runs via the unified
      # runner (scripts/run_tests.py) — the same command the pre-push hook
      # runs locally. By invariant (plans/75 §2.1) fast NEVER sets LIVE_DB:
      # pushes no longer touch the production database. The deep suite
      # (live-DB, integration, coverage, leak guard) runs nightly instead
      # (.github/workflows/nightly.yml).
      # Flutter widget tests + goldens are part of the fast tier (plan §12:
      # fast = L0+L1+L2-mock+app). The runner only invokes them when flutter
      # is on PATH — set it up here so the app's 58 tests (incl. the briefing
      # card + task-ack goldens) gate every push. Version pinned to match the
      # dev machine: golden rendering is SDK-sensitive, so a Flutter bump is
      # a deliberate, reviewed golden update.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: cd rhodey_app && flutter pub get

      - name: Fast tier — L0 + L1 + L2-mock + app (no DB)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/run_tests.py fast

      - name: Lint — Frontend (Next.js)
        run: |
          cd frontend
          npm ci
          npm run lint
