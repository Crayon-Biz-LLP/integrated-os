name: Upgrade Gate — Full Suite

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'What is this gate for? (release tag / feature / batch)'
        required: false
        default: 'manual upgrade gate'

jobs:
  gate:
    runs-on: ubuntu-latest
    # Full stack: fast (mock) + complete live suite (deep core + sim + UAT L4
    # + migrations replay + leak guard). Real Gemini latency → 240 min cap.
    # Run when NO nightly/weekly live run is active — the X4 sandbox lock
    # serializes live sessions (a concurrent run fails closed).
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install pgvector (migration replay)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgvector

      # all --live --coverage = fast tier (L0 lint + mock pytest + coverage
      # floors + flutter-if-present) THEN the complete live suite against the
      # TEST tenant (deep core, sim, UAT L4) with the leak guard wrapping the
      # session. The env-contract guard refuses to start without real secrets
      # and a resolvable Test tenant.
      - name: Full suite — fast + live, TEST tenant only
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PULSE_SECRET: ${{ secrets.PULSE_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Webhook test-chat bypass — default-off fail-closed (plans/75 §7).
          TEST_CHAT_IDS: "909999999"
        run: |
          set -o pipefail
          python scripts/run_tests.py all --live --coverage

  notify_failure:
    runs-on: ubuntu-latest
    needs: gate
    if: failure()
    steps:
      - name: Notify on failure
        run: |
          echo "⚠️ Upgrade gate FAILED at $(date) — do not ship."
          echo "Check logs: https://github.com/${{ github.repository }}/actions"
