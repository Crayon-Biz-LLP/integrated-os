name: Validate Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_timestamp:
        description: 'Deployment timestamp (ISO format, e.g. 2026-07-01T12:00:00)'
        required: false
        default: ''
  # Auto-trigger after successful CI test run on main
  workflow_run:
    workflows: ['CI — Test Suite']
    types:
      - completed
    branches:
      - main

jobs:
  validate:
    # For workflow_run triggers: only run if the triggering workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for secret in "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY"; do
            if [ -z "$secret" ]; then
              echo "❌ Missing required secrets"
              exit 1
            fi
          done
          echo "✅ Secrets present"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Determine Timestamp
        id: timestamp
        run: |
          if [ -n "${{ github.event.inputs.deploy_timestamp }}" ]; then
            echo "ts=${{ github.event.inputs.deploy_timestamp }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ts=${{ github.event.workflow_run.created_at }}" >> $GITHUB_OUTPUT
          else
            echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          fi

      - name: Wait for Modal Deployment
        id: wait_modal
        run: |
          MODAL_URL="https://danielyashwant--rhodey-os-web-endpoint.modal.run"
          echo "🔵 Waiting for Modal deployment to respond..."
          POLL_INTERVAL=15
          MAX_RETRIES=20  # 5 min total
          RETRY=0
          LAST_CODE=""

          while [ $RETRY -lt $MAX_RETRIES ]; do
            RETRY=$((RETRY + 1))

            HTTP_CODE=$(curl -s -o /tmp/modal_resp.json -w "%{http_code}" -m 30 \
              -X POST "$MODAL_URL/api/health")
            LAST_CODE="$HTTP_CODE"

            echo "  Attempt $RETRY/$MAX_RETRIES — HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Modal deployment is READY at $MODAL_URL"
              echo "state=ready" >> $GITHUB_OUTPUT
              echo "url=$MODAL_URL" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep $POLL_INTERVAL
          done

          echo "⚠️ Modal did not respond within 5 min (last HTTP $LAST_CODE) — proceeding anyway"
          echo "state=timeout" >> $GITHUB_OUTPUT

      - name: Run Deployment Validation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔍 Validating deployment since ${{ steps.timestamp.outputs.ts }}..."
          python scripts/validate_deployment.py "${{ steps.timestamp.outputs.ts }}" 2>&1

      - name: Notify on failure
        if: failure()
        run: |
          echo "⚠️ Deployment Validation FAILED after successful tests"
          echo "Check logs: https://github.com/${{ github.repository }}/actions"
