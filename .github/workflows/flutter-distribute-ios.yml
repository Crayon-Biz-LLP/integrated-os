name: Flutter — Build & Distribute (iOS TestFlight)

# Builds the iOS app on a free macOS runner (public repo) and uploads it to
# TestFlight using an App Store Connect API key.
#
# Dependency resolution: Flutter 3.44 resolves most iOS plugins via Swift
# Package Manager. Two plugins (flutter_tts, open_filex) don't support SPM
# yet, so Flutter auto-generates a Podfile and runs pod install for those
# during `flutter build ios`. The archive step runs after that, so the
# workspace has all dependencies resolved before xcodebuild archive.
#
# Signing is headless: Xcode 15+ automatic signing with -authenticationKey*
# flags lets the API key create/download the distribution certificate and
# provisioning profile on the fly.
#
# Required secrets (see plans/77-ios-testflight-beta.md):
#   APPLE_API_KEY          base64-encoded .p8 (App Store Connect API key)
#   APPLE_API_KEY_ID       key ID (App Store Connect → Integrations)
#   APPLE_API_ISSUER_ID    issuer ID (same page)
#   APPLE_TEAM_ID          10-char Apple Developer team ID
#   GOOGLE_SERVICE_INFO_PLIST  contents of Firebase GoogleService-Info.plist

on:
  push:
    branches: [main]
    paths: ['rhodey_app/**']
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: rhodey_app

      - name: Run analyzer
        run: flutter analyze
        working-directory: rhodey_app

      - name: Write Firebase iOS config
        run: echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}' > rhodey_app/ios/Runner/GoogleService-Info.plist

      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Compute auto-version from git history
        id: version
        run: |
          VERSION_NAME=$(grep '^version: ' rhodey_app/pubspec.yaml | sed 's/version: *//' | sed 's/+.*//')
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Using version $VERSION_NAME (build $VERSION_CODE)"

      # Step 1: build the Flutter app unsigned. This triggers Flutter's
      # assemble pipeline, which generates the Podfile for the two
      # CocoaPods-only plugins (flutter_tts, open_filex), runs pod
      # install, and resolves all SPM packages. The workspace is fully
      # ready for the archive step after this.
      - name: Build Flutter app (unsigned — resolves SPM + CocoaPods)
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          flutter build ios --no-codesign --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"
        working-directory: rhodey_app

      # Step 2: archive the workspace (now has all dependencies resolved)
      # with automatic signing via the App Store Connect API key.
      - name: Archive (automatic signing via App Store Connect API key)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            FLUTTER_BUILD_NAME="$VERSION_NAME" \
            FLUTTER_BUILD_NUMBER="$VERSION_CODE"
        working-directory: rhodey_app

      - name: Export IPA
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>signingStyle</key><string>automatic</string><key>teamID</key><string>%s</string></dict></plist>\n' \
            "$APPLE_TEAM_ID" > build/export_options.plist
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist build/export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
        working-directory: rhodey_app

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          IPA=$(find rhodey_app/build/ios/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa found under rhodey_app/build/ios/ipa"
            exit 1
          fi
          echo "Uploading $IPA"
          xcrun altool \
            --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID" \
            --verbose
