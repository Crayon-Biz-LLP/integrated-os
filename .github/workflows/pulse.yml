name: Pulse Engine (Rhodey SITREP)
on:
  # The 30-minute briefing heartbeat is now driven EXCLUSIVELY by
  # cron-job.org → /api/pulse-cron (Option B fan-out: per-tenant brief_tenant
  # Modal workers with 900s timeouts). This GHA workflow was the redundant
  # second scheduler racing cron-job.org on the concurrency lock — disabling
  # the schedule removes the race (and the double LLM spend) while keeping
  # manual dispatch for on-demand runs.
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_pulse]

jobs:
  run-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          for secret in "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" "$GEMINI_API_KEY" "$TELEGRAM_BOT_TOKEN" "$GOOGLE_REFRESH_TOKEN"; do
            if [ -z "$secret" ]; then
              echo "❌ One or more required secrets are missing"
              exit 1
            fi
          done
          echo "✅ All secrets present"

      - name: "Guard: no unversioned content updates on memories"
        run: |
          # DB triggers now handle memory versioning (version_memory_for_update removed intentionally).
          # Only flag updates that change content fields (content, memory_type, embedding, etc).
          # expires_at-only updates are fine (metadata field, DB trigger handles archive).
          BAD=$(grep -rn "\.table('memories')\.update({" \
            --include="*.py" \
            . | grep -E "'(content|memory_type|embedding|source)'" || true)
          if [ -n "$BAD" ]; then
            echo "❌ Inline memories.update({...}) changes content fields without versioning guard:"
            echo "$BAD"
            echo "Only expires_at-only updates are OK (DB triggers handle versioning)."
            exit 1
          fi
          echo "✅ No unversioned content updates on memories found"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: "Step 1: Execute Rhodey SITREP (The Briefing)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          PULSE_SECRET: ${{ secrets.PULSE_SECRET }}
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_CLIENT_SECRET: ${{ secrets.OUTLOOK_CLIENT_SECRET }}
          OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
          OUTLOOK_TENANT_ID: ${{ secrets.OUTLOOK_TENANT_ID }}
          OUTLOOK_SCOPES: ${{ secrets.OUTLOOK_SCOPES }}
          # App delivery + concurrency safety + LLM fallback (must be present
          # or pushes silently skip and the Redis lock fails open)
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m core.pulse_cli

  notify_failure:
    runs-on: ubuntu-latest
    needs: run-pulse
    if: failure()
    steps:
      - name: Notify on failure
        run: |
          echo "⚠️ Rhodey SITREP FAILED at $(date)"
          echo "Check logs: https://github.com/Crayon-Biz-LLP/integrated-os/actions"
